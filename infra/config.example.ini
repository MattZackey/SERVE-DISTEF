# Copy to infra/config.ini (git-ignored) and fill in the <placeholders>

[aws]
region = us-east-1
account_id = <account-id>
bucket = <your-bucket>
ecr_repo = echo:latest
model_data_prefix = models/
role_name = arn:aws:iam::<account-id>:role/service-role/<sagemaker-execution-role>
model_name = serving-echo-model
config_name = serving-echo-async-config
max_concurrent = 1
endpoint = serving-echo-async
instance = ml.g6.xlarge
variant_name = primary
enable_sns = true

# See docs/scaling.md for what each setting does
[autoscaling]
min_capacity = 0
max_capacity = 1
target_backlog_per_instance = 10.0
scale_in_cooldown = 60
scale_out_cooldown = 30
step_cooldown = 30
alarm_evaluation_periods = 1
alarm_datapoints_to_alarm = 1
alarm_threshold = 1
alarm_period = 60
